server:
  # Override with SERVER_PORT if 8080 is already taken on your machine.
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: reward
  # Local secrets live in .env (gitignored, key=value, same as any other framework).
  # "optional:" means the app still starts without it, which is how staging and prod run:
  # there the same keys arrive as real environment variables.
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/intiq}
    username: ${DB_USERNAME:intiq}
    password: ${DB_PASSWORD:intiq}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    placeholders:
      # Substituted into V2026_09_24_1000__seed_platform_admin.sql at migration time.
      platformAdminEmail: ${PLATFORM_ADMIN_EMAIL:shaikharif6190@gmail.com}
      platformAdminPhone: ${PLATFORM_ADMIN_PHONE:+919969763214}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

# Swapping a provider is a property change only. No code changes, no redeploy of other modules.
intiq:
  security:
    pii:
      # base64 of 32 random bytes. Dev value only; production comes from Secrets Manager.
      key: ${PII_KEY:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  auth:
    cookie:
      name: intiq_rt
      secure: ${COOKIE_SECURE:false}   # true everywhere except plain-http localhost
      same-site: Strict
      path: /api/v1/auth
  jwt:
    issuer: ${JWT_ISSUER:https://api.intiqrewards.in}
    # Short lived because an access token cannot be revoked once issued.
    access-ttl: 15m
    refresh-ttl: 30d
    # Blank in development: an ephemeral key pair is generated at startup.
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
  otp:
    code-length: 6
    ttl: 5m
    max-attempts: 5
    resend-cooldown: 30s
    max-per-destination: 3
    rate-window: 10m
    max-per-ip: 20
    ip-rate-window: 1h
    pepper: ${OTP_PEPPER:}
  messaging:
    # Which provider serves each channel, and what to try if it fails.
    # Email: SES primary, SMTP fallback (a second, independent delivery path if SES is down or unverified).
    # SMS / WhatsApp: MSG91. SMS has no fallback provider on purpose — see .env.example for why.
    channels:
      email:    { provider: "${EMAIL_PROVIDER:log}", fallback-provider: "${EMAIL_FALLBACK:}" }
      sms:      { provider: "${SMS_PROVIDER:log}", fallback-provider: "${SMS_FALLBACK:}" }
      whatsapp: { provider: "${WHATSAPP_PROVIDER:log}", fallback-channel: "${WHATSAPP_FALLBACK_CHANNEL:}" }
    # AWS SES: the email provider. No access key/secret here — the AWS SDK resolves those itself.
    ses:
      region: ${AWS_SES_REGION:ap-south-1}
      from-email: ${SES_FROM_EMAIL:no-reply@intiqrewards.in}
      from-name: ${SES_FROM_NAME:INTIQ Rewards}
    # SMTP: the email fallback only, for when SES is unreachable or not yet verified.
    smtp:
      from: ${EMAIL_FROM:no-reply@intiqrewards.in}
    # MSG91: SMS and WhatsApp. One account, one auth key, shared across both.
    msg91:
      base-url: ${MSG91_BASE_URL:https://control.msg91.com}
      auth-key: ${MSG91_AUTH_KEY:}
      sms:
        sender-id: ${MSG91_SENDER_ID:}
      whatsapp:
        integrated-number: ${MSG91_WA_NUMBER:}
        language-code: ${MSG91_WA_LANGUAGE:en}
      # Our template code mapped to MSG91's template id, per channel.
      templates:
        SMS:
          OTP_LOGIN: ${MSG91_SMS_TEMPLATE_OTP_LOGIN:}
        WHATSAPP:
          OTP_LOGIN: ${MSG91_WA_TEMPLATE_OTP_LOGIN:}
